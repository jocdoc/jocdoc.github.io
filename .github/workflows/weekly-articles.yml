# Runs every Monday morning, finds new articles, and sends them to you
# for approval as a pull request. Nothing goes live until you click Merge.

name: Weekly article picks

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays at 11:00 UTC (7 AM Eastern in summer, 6 AM in winter)
  workflow_dispatch:        # adds a "Run workflow" button so you can test it anytime

permissions:
  contents: write           # lets the robot save the new articles.json
  pull-requests: write      # lets the robot open the review request

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Get a copy of the website files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Search PubMed for new articles
        run: python scripts/fetch_articles.py

      - name: Send the picks for review
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: articles.json
          commit-message: Weekly article picks
          branch: weekly-articles
          delete-branch: true
          title: This week's article picks
          body-path: ${{ runner.temp }}/pr_body.md
